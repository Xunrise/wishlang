[package]
name = "wishlang"
version = "0.1.0"
edition = "2024"
description = "Create-from-usage for Rust and Java: you write the call sites, Claude writes the code underneath."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Xunrise/wishlang"

[[bin]]
name = "wishlang"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
crossbeam-channel = "0.5"
crossterm = "0.29.0"
lsp-server = "0.10.0"
notify = "8.2.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
similar = "3.2.1"
syn = { version = "3.0.9", features = ["full", "extra-traits", "visit"] }
toml = "1.1.8"
tree-sitter = "0.25"
tree-sitter-java = "0.23"
