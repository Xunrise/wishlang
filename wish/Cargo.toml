[package]
name = "wish"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.29.0"
lsp-server = "0.10.0"
notify = "8.2.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
syn = { version = "3.0.9", features = ["full", "extra-traits", "visit"] }
toml = "1.1.8"
